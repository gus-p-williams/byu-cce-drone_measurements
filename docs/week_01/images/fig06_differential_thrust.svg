  <g>
    <line x1="612" y1="196" x2="624.0" y2="196.0" stroke="#4a90d9" stroke-width="3" stroke-linecap="round"/>
    <polygon points="634,196 624.0,201.0 624.0,191.0" fill="#4a90d9"/>
  </g>
  <g>
    <rect x="657.0" y="84" width="186" height="260" rx="10" fill="#ffffff" stroke="#dde3e9" stroke-width="1.5"/>
    <text x="750" y="304" text-anchor="middle" font-weight="bold" fill="#1a1a1a">Turn right</text>
    <text x="750" y="324" text-anchor="middle" font-size="11" fill="#555555">one diagonal pair faster</text>
  </g>
  <g transform="translate(750,196)">
    <g>
      <g stroke="#333333" stroke-width="5" stroke-linecap="round">
        <line x1="-10.2" y1="-13.5" x2="-34" y2="-27"/>
        <line x1="10.2" y1="-13.5" x2="34" y2="-27"/>
        <line x1="-10.2" y1="13.5" x2="-34" y2="27"/>
