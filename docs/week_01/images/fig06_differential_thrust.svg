<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" font-family="Arial, Helvetica, sans-serif" font-size="13">
  <rect x="0" y="0" width="900" height="450" fill="#f9f9f9" rx="8"/>
  <text x="450.0" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a1a">Figure 6: Which motors speed up</text>
  <text x="450.0" y="46" text-anchor="middle" font-size="11" fill="#555555">A drone has no steering. It moves by running some rotors faster than others. The chevron marks the nose.</text>
  <g>
    <rect x="57.0" y="84" width="186" height="260" rx="10" fill="#ffffff" stroke="#dde3e9" stroke-width="1.5"/>
    <text x="150" y="304" text-anchor="middle" font-weight="bold" fill="#1a1a1a">Hover</text>
    <text x="150" y="324" text-anchor="middle" font-size="11" fill="#555555">all four the same</text>
  </g>
  <g transform="translate(150,196)">
    <g>
      <g stroke="#333333" stroke-width="5" stroke-linecap="round">
        <line x1="-10.2" y1="-13.5" x2="-34" y2="-27"/>
        <line x1="10.2" y1="-13.5" x2="34" y2="-27"/>
        <line x1="-10.2" y1="13.5" x2="-34" y2="27"/>
        <line x1="10.2" y1="13.5" x2="34" y2="27"/>
      </g>
      <circle cx="-34" cy="-27" r="15" fill="#8fa3b5" stroke="#333333" stroke-width="1.2"/>
      <circle cx="34" cy="-27" r="15" fill="#8fa3b5" stroke="#333333" stroke-width="1.2"/>
      <circle cx="-34" cy="27" r="15" fill="#8fa3b5" stroke="#333333" stroke-width="1.2"/>
      <circle cx="34" cy="27" r="15" fill="#8fa3b5" stroke="#333333" stroke-width="1.2"/>
      <rect x="-12" y="-22" width="24" height="44" rx="6" fill="#d0d7de" stroke="#333333" stroke-width="1.5"/>
      <g stroke="#444444" stroke-width="3" stroke-linecap="round" fill="none">
        <line x1="-7" y1="-30" x2="0" y2="-40"/>
        <line x1="0" y1="-40" x2="7" y2="-30"/>
      </g>
    </g>
  </g>
  <g>
    <rect x="257.0" y="84" width="186" height="260" rx="10" fill="#ffffff" stroke="#dde3e9" stroke-width="1.5"/>
    <text x="350" y="304" text-anchor="middle" font-weight="bold" fill="#1a1a1a">Fly forward</text>
    <text x="350" y="324" text-anchor="middle" font-size="11" fill="#555555">rear pair faster, so the nose tips down</text>
  </g>
  <g transform="translate(350,196)">
    <g>
      <g stroke="#333333" stroke-width="5" stroke-linecap="round">
        <line x1="-10.2" y1="-13.5" x2="-34" y2="-27"/>
        <line x1="10.2" y1="-13.5" x2="34" y2="-27"/>
        <line x1="-10.2" y1="13.5" x2="-34" y2="27"/>
        <line x1="10.2" y1="13.5" x2="34" y2="27"/>
      </g>
      <circle cx="-34" cy="-27" r="11" fill="#c3ccd4" stroke="#333333" stroke-width="1.2"/>
      <circle cx="34" cy="-27" r="11" fill="#c3ccd4" stroke="#333333" stroke-width="1.2"/>
      <circle cx="-34" cy="27" r="21" fill="#4a90d9" stroke="#333333" stroke-width="1.2"/>
      <circle cx="34" cy="27" r="21" fill="#4a90d9" stroke="#333333" stroke-width="1.2"/>
      <rect x="-12" y="-22" width="24" height="44" rx="6" fill="#d0d7de" stroke="#333333" stroke-width="1.5"/>
      <g stroke="#444444" stroke-width="3" stroke-linecap="round" fill="none">
        <line x1="-7" y1="-30" x2="0" y2="-40"/>
        <line x1="0" y1="-40" x2="7" y2="-30"/>
      </g>
    </g>
  </g>
  <g>
    <line x1="350" y1="140" x2="350.0" y2="122.0" stroke="#4a90d9" stroke-width="3" stroke-linecap="round"/>
    <polygon points="350,112 355.0,122.0 345.0,122.0" fill="#4a90d9"/>
  </g>
  <g>
    <rect x="457.0" y="84" width="186" height="260" rx="10" fill="#ffffff" stroke="#dde3e9" stroke-width="1.5"/>
    <text x="550" y="304" text-anchor="middle" font-weight="bold" fill="#1a1a1a">Slide right</text>
    <text x="550" y="324" text-anchor="middle" font-size="11" fill="#555555">left pair faster, so it leans right</text>
  </g>
  <g transform="translate(550,196)">
    <g>
      <g stroke="#333333" stroke-width="5" stroke-linecap="round">
